name: SMS IR-RIS Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clinical-quality-gate:
    name: Clinical Mathematical QA, Type Safety & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: TypeScript Static Analysis & Type Checking
        run: npx tsc --noEmit

      - name: Execute Vitest Clinical Mathematical QA Suite
        run: npx vitest run --reporter=verbose

      - name: Verify Prisma Schema Validity
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sms_ir_ris_test?schema=public"
        continue-on-error: true

      - name: Production Bundle Compilation
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
