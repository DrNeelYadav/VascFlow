{{- if .Values.fhirService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vascule-fhir-service
  labels:
    {{- include "vascule-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: fhir-service
spec:
  replicas: {{ .Values.fhirService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vascule-os.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: fhir-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "vascule-os.labels" . | nindent 8 }}
        app.kubernetes.io/component: fhir-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: fhir-service
      containers:
        - name: fhir-service
          image: "{{ .Values.fhirService.image.repository }}:{{ .Values.fhirService.image.tag }}"
          imagePullPolicy: {{ .Values.fhirService.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.fhirService.service.httpPort }}
              protocol: TCP
            - name: mllp
              containerPort: {{ .Values.fhirService.service.mllpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.fhirService.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.fhirService.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.fhirService.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.fhirService.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.fhirService.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.fhirService.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.fhirService.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.fhirService.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.fhirService.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.fhirService.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.fhirService.resources | nindent 12 }}
          env:
            {{- range $key, $val := .Values.fhirService.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
{{- end }}
---
{{- if .Values.fhirService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: vascule-fhir-service
  labels:
    {{- include "vascule-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: fhir-service
spec:
  type: {{ .Values.fhirService.service.type }}
  ports:
    - name: http
      port: {{ .Values.fhirService.service.httpPort }}
      targetPort: {{ .Values.fhirService.service.httpPort }}
      protocol: TCP
    - name: mllp
      port: {{ .Values.fhirService.service.mllpPort }}
      targetPort: {{ .Values.fhirService.service.mllpPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "vascule-os.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: fhir-service
{{- end }}
---
{{- if and .Values.fhirService.enabled .Values.fhirService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vascule-fhir-service-hpa
  labels:
    {{- include "vascule-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: fhir-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vascule-fhir-service
  minReplicas: {{ .Values.fhirService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.fhirService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.fhirService.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.fhirService.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
