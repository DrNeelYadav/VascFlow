{{- if .Values.webApp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vascule-webapp
  labels:
    {{- include "vascule-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-app
spec:
  replicas: {{ .Values.webApp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vascule-os.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "vascule-os.labels" . | nindent 8 }}
        app.kubernetes.io/component: web-app
      annotations:
        prometheus.io/scrape: "false"
        {{- if and .Values.secrets .Values.secrets.vault .Values.secrets.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.secrets.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-database: {{ .Values.secrets.vault.databaseSecretPath | quote }}
        vault.hashicorp.com/agent-inject-secret-abdm: {{ .Values.secrets.vault.abdmSecretPath | quote }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: web-app
      containers:
        - name: web-app
          image: "{{ .Values.webApp.image.repository }}:{{ .Values.webApp.image.tag }}"
          imagePullPolicy: {{ .Values.webApp.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.webApp.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.webApp.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.webApp.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.webApp.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.webApp.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.webApp.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.webApp.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.webApp.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.webApp.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.webApp.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.webApp.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.webApp.resources | nindent 12 }}
          env:
            {{- range $key, $val := .Values.webApp.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vascule-database-secrets
                  key: database-url
                  optional: true
            - name: DATABASE_READ_REPLICA_URL
              valueFrom:
                secretKeyRef:
                  name: vascule-database-secrets
                  key: database-read-replica-url
                  optional: true
            - name: ABDM_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: vascule-database-secrets
                  key: abdm-private-key
                  optional: true
            - name: ABDM_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: vascule-database-secrets
                  key: abdm-public-key
                  optional: true
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: vascule-database-secrets
                  key: nextauth-secret
                  optional: true
{{- end }}
---
{{- if .Values.webApp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: vascule-webapp
  labels:
    {{- include "vascule-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-app
spec:
  type: {{ .Values.webApp.service.type }}
  ports:
    - name: http
      port: {{ .Values.webApp.service.port }}
      targetPort: {{ .Values.webApp.service.targetPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "vascule-os.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web-app
{{- end }}
---
{{- if and .Values.webApp.enabled .Values.webApp.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vascule-webapp-hpa
  labels:
    {{- include "vascule-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vascule-webapp
  minReplicas: {{ .Values.webApp.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.webApp.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.webApp.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.webApp.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
