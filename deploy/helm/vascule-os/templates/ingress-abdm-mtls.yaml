{{- if and .Values.ingress.enabled .Values.ingress.abdmMtls .Values.ingress.abdmMtls.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vascule-abdm-mtls-ingress
  labels:
    {{- include "vascule-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: abdm-gateway
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tlsClusterIssuer | default "rajasthan-health-ca-issuer" | quote }}
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "true"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ .Values.ingress.abdmMtls.caSecretName | default "default/nha-abdm-ca-cert" | quote }}
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts | first | pluck "host" | first }}
      secretName: {{ .Values.ingress.abdmMtls.tlsSecretName | default "vascule-tls-certificate" }}
  rules:
    - host: {{ .Values.ingress.hosts | first | pluck "host" | first }}
      http:
        paths:
          - path: /api/abdm
            pathType: Prefix
            backend:
              service:
                name: vascule-webapp
                port:
                  number: 3000
{{- end }}
