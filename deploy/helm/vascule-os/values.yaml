global:
  environment: production
  domain: vascule.sms.rajasthan.gov.in
  clusterDomain: cluster.local
  tlsIssuer: letsencrypt-prod
  imagePullSecrets:
    - name: vascule-registry-secret

# ---------------------------------------------------------------------------
# Frontend: Next.js Web App
# ---------------------------------------------------------------------------
webApp:
  enabled: true
  replicaCount: 3
  image:
    repository: registry.vascule-os.org/vascule/web-app
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
  env:
    NODE_ENV: production
    NEXTAUTH_URL: https://vascule.sms.rajasthan.gov.in
    AUTH_SERVICE_INTERNAL_URL: http://vascule-auth-service:8080
    FHIR_SERVICE_INTERNAL_URL: http://vascule-fhir-service:8081
    DICOM_SERVICE_INTERNAL_URL: http://vascule-dicom-service:8082
    REDIS_URL: redis://:VasculeSecureRedis2026@vascule-redis:6379/0

# ---------------------------------------------------------------------------
# Backend: Golang Auth Service
# ---------------------------------------------------------------------------
authService:
  enabled: true
  replicaCount: 3
  image:
    repository: registry.vascule-os.org/vascule/auth-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  probes:
    liveness:
      path: /api/healthz
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /api/healthz
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 2
  env:
    PORT: "8080"
    DATABASE_URL: postgresql://vascule_admin:vascule_prod_secret_2026@vascule-pg-rw:5432/vascule_os?sslmode=verify-full
    REDIS_HOST: vascule-redis:6379

# ---------------------------------------------------------------------------
# Backend: Golang FHIR & HL7 Service
# ---------------------------------------------------------------------------
fhirService:
  enabled: true
  replicaCount: 3
  image:
    repository: registry.vascule-os.org/vascule/fhir-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 8081
    mllpPort: 2575
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
  env:
    PORT: "8081"
    MLLP_PORT: "2575"
    DATABASE_URL: postgresql://vascule_admin:vascule_prod_secret_2026@vascule-pg-rw:5432/vascule_os?sslmode=verify-full

# ---------------------------------------------------------------------------
# Backend: Golang DICOM QIDO-RS Service
# ---------------------------------------------------------------------------
dicomService:
  enabled: true
  replicaCount: 3
  image:
    repository: registry.vascule-os.org/vascule/dicom-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
    targetPort: 8082
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
  env:
    PORT: "8082"
    DATABASE_URL: postgresql://vascule_admin:vascule_prod_secret_2026@vascule-pg-ro:5432/vascule_os?sslmode=verify-full

# ---------------------------------------------------------------------------
# Secrets Management: SealedSecrets & HashiCorp Vault Injection
# ---------------------------------------------------------------------------
secrets:
  sealedSecrets:
    enabled: true
    encryptedDatabaseUrl: "AgB...dummySealedPayload..."
    encryptedDatabaseReadReplicaUrl: "AgB...dummySealedPayload..."
    encryptedAbdmPrivateKey: "AgB...dummySealedPayload..."
    encryptedAbdmPublicKey: "AgB...dummySealedPayload..."
    encryptedNextauthSecret: "AgB...dummySealedPayload..."
  standardSecret:
    enabled: false
    databaseUrl: ""
    databaseReadReplicaUrl: ""
    abdmPrivateKey: ""
    abdmPublicKey: ""
    nextauthSecret: ""
  vault:
    enabled: false
    role: "vascule-workstation"
    databaseSecretPath: "secret/data/hospital/database"
    abdmSecretPath: "secret/data/hospital/abdm"

# ---------------------------------------------------------------------------
# Zero-Downtime Pre-Upgrade Database Migrations
# ---------------------------------------------------------------------------
databaseMigration:
  enabled: true

# ---------------------------------------------------------------------------
# Ingress & Strict TLS 1.3 Termination (Cert-Manager)
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  tlsClusterIssuer: "rajasthan-health-ca-issuer"
  annotations:
    cert-manager.io/cluster-issuer: rajasthan-health-ca-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
  hosts:
    - host: vascule.sms.rajasthan.gov.in
      paths:
        - path: /
          pathType: Prefix
          service:
            name: vascule-webapp
            port: 3000
  tls:
    - secretName: vascule-tls-certificate
      hosts:
        - vascule.sms.rajasthan.gov.in

  # ABDM National Health Authority (NHA) Gateway Mutual TLS
  abdmMtls:
    enabled: true
    caSecretName: "default/nha-abdm-ca-cert"
    tlsSecretName: "vascule-tls-certificate"

# ---------------------------------------------------------------------------
# Zero-Trust Network Policies
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
