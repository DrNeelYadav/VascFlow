apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: vascule-production-canary
  namespace: vascule-system
  labels:
    app.kubernetes.io/name: vascule-web
    app.kubernetes.io/part-of: vascule-os
    app.kubernetes.io/component: traffic-shifter
    hospital.rajasthan.gov.in/facility: sms-jaipur
spec:
  # Deployment reference targeted for progressive traffic migration
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vascule-web
  # Service mesh / Ingress provider configuration
  provider: nginx
  # Ingress reference routing clinical traffic
  ingressRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: vascule-ingress
  # Service generation parameters
  service:
    port: 3000
    targetPort: 3000
    name: vascule-web
    portDiscovery: true
    gateways:
      - vascule-system/vascule-gateway
    hosts:
      - ris.sms.rajasthan.gov.in
      - angio.sms.rajasthan.gov.in
    retries:
      attempts: 3
      perTryTimeout: 2000ms
      retryOn: "5xx,connect-failure,refused-stream"
  # Automated Progressive Traffic Shifting & Health-Gate Analysis
  analysis:
    interval: 1m
    threshold: 2
    maxWeight: 100
    stepWeight: 10
    stepWeightPromotion: 25
    # Health Probe Metrics for Clinical Cutover
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99.9
        interval: 1m
      - name: http-5xx-error-rate
        templateRef:
          name: http-5xx-rate-probe
          namespace: vascule-system
        thresholdRange:
          max: 0.1
        interval: 1m
      - name: latency-p99-threshold
        templateRef:
          name: p99-latency-probe
          namespace: vascule-system
        thresholdRange:
          max: 800
        interval: 1m
    # Automated Webhook verification gates
    webhooks:
      - name: pre-rollout-clinical-smoke-test
        type: pre-rollout
        url: http://flagger-loadtester.vascule-system/
        timeout: 15s
        metadata:
          type: bash
          cmd: "curl -s -f http://vascule-web-canary.vascule-system:3000/api/proxy/auth/health | grep -q '\"status\":\"healthy\"'"
      - name: active-load-and-latency-validation
        type: rollout
        url: http://flagger-loadtester.vascule-system/
        timeout: 10s
        metadata:
          type: cmd
          cmd: "hey -z 30s -q 20 -c 4 http://ris.sms.rajasthan.gov.in/dashboard"
      - name: emergency-cutback-alert-webhook
        type: rollback
        url: http://flagger-loadtester.vasagger-system/
        timeout: 10s
        metadata:
          type: bash
          cmd: "/bin/sh -c 'logger -p local0.crit \"[EMERGENCY ROLLBACK] Vascule OS Canary failed health gates. Reverting to legacy SMS RIS!\"'"

---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: http-5xx-rate-probe
  namespace: vascule-system
spec:
  provider:
    type: prometheus
    address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
  query: |
    sum(rate(http_requests_total{namespace="vascule-system",app="vascule-web",status=~"5.*"}[1m]))
    /
    sum(rate(http_requests_total{namespace="vascule-system",app="vascule-web"}[1m]))
    * 100

---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: p99-latency-probe
  namespace: vascule-system
spec:
  provider:
    type: prometheus
    address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
  query: |
    histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="vascule-system",app="vascule-web"}[1m])) by (le)) * 1000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vascule-ingress
  namespace: vascule-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-sms-hospital"
spec:
  tls:
    - hosts:
        - ris.sms.rajasthan.gov.in
        - angio.sms.rajasthan.gov.in
      secretName: vascule-tls-cert
  rules:
    - host: ris.sms.rajasthan.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vascule-web
                port:
                  number: 3000

---
# Legacy Hospital RIS/PACS Routing Stub for Seamless Blue/Green Rollback
apiVersion: v1
kind: Service
metadata:
  name: legacy-sms-ris
  namespace: vascule-system
  labels:
    app.kubernetes.io/name: legacy-sms-ris
    app.kubernetes.io/part-of: sms-hospital-infrastructure
spec:
  type: ExternalName
  externalName: legacy-ris.sms.internal
  ports:
    - port: 80
      targetPort: 80
      name: http
