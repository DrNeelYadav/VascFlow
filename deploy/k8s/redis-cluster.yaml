# ===========================================================================
# Vascule OS Production Redis High-Availability Caching & Session Store
# Master-Replica Architecture with Automated Sentinel Sentinel Failover
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: vascule-redis-secret
  namespace: default
type: Opaque
stringData:
  redis-password: "VasculeSecureRedis2026!EncryptedSessionKey"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vascule-redis-config
  namespace: default
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    daemonize no
    supervised no
    loglevel notice
    databases 16
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    maxmemory 2gb
    maxmemory-policy allkeys-lru
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vascule-redis
  namespace: default
  labels:
    app.kubernetes.io/name: vascule-redis
    app.kubernetes.io/part-of: vascule-os
spec:
  serviceName: vascule-redis-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vascule-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vascule-redis
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - vascule-redis
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - "sh"
            - "-c"
            - |
              if [ "$(hostname)" = "vascule-redis-0" ]; then
                redis-server /etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"
              else
                redis-server /etc/redis/redis.conf --requirepass "$REDIS_PASSWORD" --masterauth "$REDIS_PASSWORD" --replicaof vascule-redis-0.vascule-redis-headless.default.svc.cluster.local 6379
              fi
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vascule-redis-secret
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2560Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: vascule-redis-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vascule-redis-headless
  namespace: default
  labels:
    app.kubernetes.io/name: vascule-redis
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: vascule-redis
---
apiVersion: v1
kind: Service
metadata:
  name: vascule-redis
  namespace: default
  labels:
    app.kubernetes.io/name: vascule-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: vascule-redis
