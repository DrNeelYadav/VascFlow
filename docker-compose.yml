services:
  # Database Service: High-performance PostgreSQL 16 Alpine
  postgres:
    image: postgres:16-alpine
    container_name: vascule-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vascule_os}
      POSTGRES_USER: ${POSTGRES_USER:-vascule_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vascule_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vascule_admin} -d ${POSTGRES_DB:-vascule_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vascule-network

  # Clinical Web Application (Next.js Monorepo UI)
  web-app:
    build:
      context: .
      dockerfile: ./apps/web-app/Dockerfile
    container_name: vascule-web-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-vascule_admin}:${POSTGRES_PASSWORD:-vascule_local_dev}@postgres:5432/${POSTGRES_DB:-vascule_os}?schema=public}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-vascule_local_dev_nextauth_secret_key_32c}
      AUTH_SERVICE_INTERNAL_URL: ${AUTH_SERVICE_INTERNAL_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vascule-network

networks:
  vascule-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
